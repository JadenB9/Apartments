<!doctype html>
<!--
  Open Graph share image template (1200×630).
  Regenerate public/og.png by screenshotting this file at 1200×630, e.g.:
    npx playwright screenshot --viewport-size=1200,630 scripts/og-template.html public/og.png
  (or any headless browser). No runtime dependency — the PNG is checked in.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    position: relative;
    background: #f2efe9;
    font-family: Georgia, "Times New Roman", serif;
    color: #221f1a;
  }
  /* dotted "map" backdrop */
  .dots {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(#d9d3c6 1.6px, transparent 1.6px);
    background-size: 26px 26px;
    opacity: 0.55;
  }
  /* route line motif: Baltimore -> DC */
  svg.route { position: absolute; inset: 0; }
  .card {
    position: absolute;
    left: 84px;
    top: 128px;
    width: 720px;
  }
  h1 {
    font-size: 92px;
    font-weight: 600;
    letter-spacing: 0.5px;
    line-height: 1.04;
  }
  h1 .amp { color: #b0501f; font-style: italic; }
  p.tag {
    margin-top: 26px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 30px;
    line-height: 1.4;
    color: #6e675a;
    max-width: 640px;
  }
  .pins {
    position: absolute;
    left: 86px;
    bottom: 86px;
    display: flex;
    gap: 14px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 22px;
    color: #6e675a;
  }
  .pin {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    background: #faf8f4;
    border: 1.5px solid #d9d3c6;
    border-radius: 999px;
  }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
</style>
</head>
<body>
  <div class="dots"></div>

  <svg class="route" viewBox="0 0 1200 630" fill="none">
    <!-- corridor path -->
    <path d="M 1010 96 C 940 210, 900 300, 926 520"
          stroke="#b0501f" stroke-width="5" stroke-dasharray="2 14" stroke-linecap="round"/>
    <circle cx="1010" cy="96" r="17" fill="#221f1a"/>
    <circle cx="926" cy="520" r="17" fill="#221f1a"/>
    <circle cx="948" cy="270" r="26" fill="#b0501f"/>
    <circle cx="948" cy="270" r="40" fill="none" stroke="#b0501f" stroke-width="3" opacity="0.35"/>
    <text x="1038" y="104" font-family="Arial" font-size="24" fill="#6e675a">Baltimore</text>
    <text x="806" y="548" font-family="Arial" font-size="24" fill="#6e675a">Washington</text>
  </svg>

  <div class="card">
    <h1>Corridor <span class="amp">&amp;</span> Co.</h1>
    <p class="tag">Every apartment, restaurant, shop &amp; thing to do between Baltimore and Washington — on one fast map.</p>
  </div>

  <div class="pins">
    <span class="pin"><span class="dot" style="background:#e8590c"></span>Apartments</span>
    <span class="pin"><span class="dot" style="background:#c92a2a"></span>Food</span>
    <span class="pin"><span class="dot" style="background:#5f3dc4"></span>Shopping</span>
    <span class="pin"><span class="dot" style="background:#2b8a3e"></span>Entertainment</span>
  </div>
</body>
</html>
