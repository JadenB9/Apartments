# Refreshes public/data/*.json with the full OpenStreetMap dataset via the
# Overpass API. GitHub-hosted runners can reach Overpass, so this keeps the
# committed snapshot current without any local tooling.
#
# NOTE: scheduled workflows only run from the default branch. This activates
# once the branch is merged to main; it can also be run manually from the
# Actions tab (workflow_dispatch).

name: Refresh OSM data

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch data from Overpass
        run: bun run fetch-data

      - name: Validate output
        run: bun test src/data/taxonomy.test.ts src/data/links.test.ts

      - name: Commit refreshed data
        run: |
          if git diff --quiet public/data; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "chore(data): refresh OpenStreetMap dataset"
          git push
